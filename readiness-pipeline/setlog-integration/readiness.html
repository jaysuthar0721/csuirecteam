<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Readiness</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --paper: #EDEAE3;
  --paper-line: #D9D4C8;
  --ink: #1B2430;
  --ink-soft: #5B6472;
  --nominal: #2E7D6B;
  --caution: #C97A2E;
  --critical: #B33F3F;
  --ref: #3B5BA5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 32px 20px 60px;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
.wrap { max-width: 900px; margin: 0 auto; }
header {
  display: flex; justify-content: space-between; align-items: baseline;
  flex-wrap: wrap; gap: 8px;
  border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 4px;
}
.rule2 { border-top: 1px solid var(--ink); opacity: 0.4; margin-bottom: 28px; }
h1 { font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0; font-weight: 700; }
.meta { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--ink-soft); text-align: right; }
.panel { border: 1px solid var(--ink); background: rgba(255,255,255,0.35); padding: 16px 18px; margin-bottom: 20px; }
.panel-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 8px 0; font-weight: 600; }
.hero { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.hero-gauge { flex: 1 1 420px; min-width: 280px; }
.hero-status { flex: 0 0 auto; text-align: right; }
.band-tag { display: inline-block; font-family: ui-monospace, monospace; font-size: 13px; letter-spacing: 0.08em; font-weight: 700; padding: 4px 10px; border: 1px solid currentColor; }
.hero-date { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-soft); margin-top: 6px; }
.coach-note { margin-top: 10px; font-size: 13px; line-height: 1.5; border-left: 2px solid var(--ink); padding-left: 10px; }
.components { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.trends { display: grid; grid-template-columns: 1fr; gap: 20px; }
table { width: 100%; border-collapse: collapse; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--paper-line); white-space: nowrap; }
th { color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; }
td.note { white-space: normal; color: var(--ink-soft); font-family: -apple-system, sans-serif; font-size: 12px; }
tr:hover td { background: rgba(59,91,165,0.06); }
.empty { border: 1px dashed var(--ink-soft); padding: 40px 20px; text-align: center; font-family: ui-monospace, monospace; color: var(--ink-soft); }

.lock-screen {
  max-width: 360px; margin: 80px auto; text-align: center;
  border: 1px solid var(--ink); padding: 32px 24px; background: rgba(255,255,255,0.35);
}
.lock-screen input {
  width: 100%; padding: 10px 12px; margin: 16px 0 10px;
  font-family: ui-monospace, monospace; font-size: 14px;
  border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
}
.lock-screen button {
  width: 100%; padding: 10px; font-family: ui-monospace, monospace;
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--ink); color: var(--paper); border: none; cursor: pointer;
}
.lock-screen button:hover { opacity: 0.85; }
.lock-error { color: var(--critical); font-size: 12px; font-family: ui-monospace, monospace; min-height: 16px; margin-top: 8px; }
.lock-remember { font-size: 11px; color: var(--ink-soft); margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Readiness Log</h1>
  <div class="meta" id="meta">&nbsp;</div>
</header>
<div class="rule2"></div>

<div id="lock" class="lock-screen">
  <p class="panel-label" style="margin-bottom:0">LOCKED</p>
  <p style="font-size:13px;color:var(--ink-soft)">Enter your passphrase to decrypt today's readiness data.</p>
  <input type="password" id="passphrase" placeholder="passphrase" autocomplete="off">
  <button id="unlock-btn">Decrypt</button>
  <div class="lock-error" id="lock-error"></div>
  <label class="lock-remember">
    <input type="checkbox" id="remember"> remember for this tab session
  </label>
</div>

<div id="dashboard" style="display:none"></div>

</div>

<script src="js/readiness-crypto.js"></script>
<script src="js/readiness-charts.js"></script>
<script>
// Where the encrypted payload lives, relative to this page.
const DATA_URL = "./readiness_data.enc.json";
const SESSION_KEY = "readiness_passphrase";

async function tryUnlock(passphrase) {
  const errEl = document.getElementById("lock-error");
  errEl.textContent = "";
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (!res.ok) {
      errEl.textContent = `Couldn't load ${DATA_URL} (${res.status}). Has it been published yet?`;
      return;
    }
    const payload = await res.json();
    const entries = await decryptPayload(payload, passphrase);

    document.getElementById("lock").style.display = "none";
    const dash = document.getElementById("dashboard");
    dash.style.display = "block";
    dash.innerHTML = renderDashboardHTML(entries, { historyWindow: 30, targetSleepHours: 8.0 });

    const latest = entries[entries.length - 1];
    document.getElementById("meta").textContent =
      `${entries.length} DAYS LOGGED \u00b7 LATEST ${latest ? latest.date : "?"}`;

    if (document.getElementById("remember").checked) {
      sessionStorage.setItem(SESSION_KEY, passphrase);
    }
  } catch (e) {
    errEl.textContent =
      e.name === "OperationError" ? "Wrong passphrase." : `Error: ${e.message}`;
  }
}

document.getElementById("unlock-btn").addEventListener("click", () => {
  tryUnlock(document.getElementById("passphrase").value);
});
document.getElementById("passphrase").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryUnlock(e.target.value);
});

// Auto-unlock if we remembered a passphrase for this tab session.
const remembered = sessionStorage.getItem(SESSION_KEY);
if (remembered) {
  document.getElementById("passphrase").value = remembered;
  document.getElementById("remember").checked = true;
  tryUnlock(remembered);
}
</script>
</body>
</html>
